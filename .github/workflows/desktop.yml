name: Desktop
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
            suffix: ""
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            bundles: nsis
            suffix: ".exe"
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            bundles: nsis
            suffix: ".exe"
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "15.6"
      CARGO_TERM_COLOR: always
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - run: rustup update stable --no-self-update
      - run: rustup target add ${{ matrix.target }}
      - run: npm ci
      - run: python scripts/prepare_tools.py ${{ matrix.target }}
      - shell: bash
        run: |
          export ROOTS_TEST_TYPST="$PWD/src-tauri/binaries/typst-${{ matrix.target }}${{ matrix.suffix }}"
          cargo test --locked --manifest-path src-tauri/Cargo.toml --no-default-features --target ${{ matrix.target }}
          mkdir -p output/pdf
          cargo run --locked --manifest-path src-tauri/Cargo.toml --no-default-features --target ${{ matrix.target }} --bin roots-check -- fixtures/synthetic-myheritage.txt output/pdf/roots-local-beispiel.pdf "$ROOTS_TEST_TYPST" --synthetic
      - run: npm run tauri -- build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: roots-local-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            output/pdf/roots-local-beispiel.pdf
