name: Desktop
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  package:
    runs-on: macos-15
    env:
      TARGET: aarch64-apple-darwin
      MACOSX_DEPLOYMENT_TARGET: "15.6"
      CARGO_TERM_COLOR: always
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - run: rustup update stable --no-self-update
      - run: python -m unittest discover -s scripts -p "test_*.py"
      - run: python -m pip install pypdf==7.1.0
      - run: npm ci
      - run: python scripts/prepare_tools.py "$TARGET"
      - run: |
          export ROOTS_TEST_TYPST="$PWD/src-tauri/binaries/typst-$TARGET"
          export ROOTS_TEST_PYTHON=python
          cargo test --locked --manifest-path src-tauri/Cargo.toml --no-default-features
          mkdir -p output/pdf
          cargo run --locked --manifest-path src-tauri/Cargo.toml --no-default-features --example roots-check -- fixtures/synthetic-myheritage.txt output/pdf/roots-local-en.pdf "$ROOTS_TEST_TYPST" --synthetic
          cargo run --locked --manifest-path src-tauri/Cargo.toml --no-default-features --example roots-check -- fixtures/synthetic-myheritage.txt output/pdf/roots-local-de.pdf "$ROOTS_TEST_TYPST" --synthetic --german
      - run: python scripts/verify_pdf.py output/pdf/roots-local-en.pdf
      - run: python scripts/verify_pdf.py output/pdf/roots-local-de.pdf de
      - run: npm run tauri -- build --bundles app
      - run: |
          base="src-tauri/target/release/bundle"
          mkdir -p "$base/dmg"
          scripts/package_macos.sh "$base/macos/Roots Local.app" "$base/dmg/Roots Local_arm64.dmg"
          python scripts/package_checksums.py "$base" output/pdf/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: roots-local-aarch64-apple-darwin
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            output/pdf/roots-local-en.pdf
            output/pdf/roots-local-de.pdf
            output/pdf/SHA256SUMS
