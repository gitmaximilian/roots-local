name: Web
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read

# Builds the static web app reproducibly, runs every test including the
# privacy suite, and uploads dist/ with SHA256SUMS. Deployment to Cloudflare
# Pages is a separate, manual step.
jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      CARGO_TERM_COLOR: always
      SOURCE_DATE_EPOCH: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - run: rustup update stable --no-self-update && rustup target add wasm32-unknown-unknown
      - run: cargo install wasm-bindgen-cli --version 0.2.100 --locked
      - run: |
          curl -fsSL -o binaryen.tar.gz https://github.com/WebAssembly/binaryen/releases/download/version_133/binaryen-version_133-x86_64-linux.tar.gz
          tar xzf binaryen.tar.gz
          echo "$PWD/binaryen-version_133/bin" >> "$GITHUB_PATH"
      - run: python -m pip install pypdf==7.1.0
      - run: python -m unittest discover -s scripts -p "test_*.py"
      - run: ROOTS_TEST_PYTHON=python ROOTS_KEEP_CRAM="$PWD/fixtures/cram" cargo test --locked -p roots-core -p roots-pdf
      - run: npm ci
      - run: npm run test:unit
      - run: npm run build:wasm
      - run: npm run build
      - run: npm run test:parity -- python
      - run: npx playwright install --with-deps chromium webkit
      - run: ROOTS_TEST_PYTHON=python npm run test:e2e -- --trace off
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: roots-local-web
          path: dist/
