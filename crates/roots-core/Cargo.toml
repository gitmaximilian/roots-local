[package]
name = "roots-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Platform-independent analysis, catalog, and report rendering for Roots Local."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
flate2 = "1"
md-5 = "0.11"
zip = { version = "4", default-features = false, features = ["deflate"] }
sha2 = "0.10"
ed25519-dalek = "2"
noodles = { version = "0.119", features = ["cram", "fasta", "sam", "core"] }
typst = "0.15.1"
typst-pdf = "0.15.1"
typst-layout = "0.15.1"
typst-assets = { version = "0.15.1", features = ["fonts"] }

[dev-dependencies]
tempfile = "3"
