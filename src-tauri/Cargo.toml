[package]
name = "roots-local"
version = "0.1.0"
edition = "2021"
default-run = "roots-local"
license = "Apache-2.0"

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-plugin-dialog"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", optional = true , features = [] }
tauri-plugin-dialog = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
flate2 = "1"
md-5 = "0.11"
tempfile = "3"
zip = { version = "4", default-features = false, features = ["deflate"] }
rusqlite = { version = "0.37", features = ["bundled"] }
sha2 = "0.10"
ed25519-dalek = "2"
noodles = { version = "0.119", features = ["cram", "fasta", "sam", "core"] }

[[bin]]
name = "roots-local"
path = "src/main.rs"
required-features = ["desktop"]
